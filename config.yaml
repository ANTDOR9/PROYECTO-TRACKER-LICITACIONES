# ============================================================
#  TRACKER DE LICITACIONES - Brighter Peru
#  Configuracion editable SIN tocar codigo (para Monica/Analid).
#  Aqui se controla QUE se busca y QUE se descarta.
# ============================================================

# --- Palabras clave agrupadas por categoria ---
# Cada resultado se etiqueta con la categoria cuya palabra coincidio.
# El matcher tolera plurales y tildes.
palabras_clave:
  Pantallas interactivas:
    - "pantalla interactiva"
    - "panel interactivo"
    - "pizarra interactiva"
    - "pizarra digital"
    - "monitor interactivo"
    - "pantalla tactil"
  Pantallas y senaletica:
    - "pantalla led"
    - "pantalla digital"
    - "senalizacion digital"
    - "video wall"
    - "videowall"
  Kioscos y totems:
    - "kiosco interactivo"
    - "kiosco digital"
    - "totem interactivo"
    - "totem multimedia"
    - "totem tactil"
  Audiovisual:
    - "equipo audiovisual"
    - "equipamiento audiovisual"
    - "sistema audiovisual"
    - "proyector multimedia"
    - "proyector interactivo"
    - "videoproyector"
    - "sistema de videoconferencia"

# --- Exclusiones: descartan un registro aunque tenga palabra clave ---
# (evitan falsos positivos detectados en pruebas reales)
palabras_excluir:
  - "protector de pantalla"
  - "mica de pantalla"
  - "lamina protectora"
  - "luminaria"            # "luminaria tipo proyector" = foco LED, no proyector de video
  - "optotipo"             # proyector oftalmologico
  - "totem publicitario"   # totem de feria/evento, no kiosco digital
  - "campo ferial"
  - "estand"
  - "presa"                # "pantalla de la presa" = cara del dique, no pantalla
  - "impermeabilizacion"
  - "drone"
  - "vehiculo aereo"

# --- Filtros por defecto del dashboard ---
filtros:
  monto_minimo: 0
  departamentos: []

# --- Fuentes de datos ---
fuentes:
  seace_vigentes:
    descripcion: "API publica SEACE - oportunidades vigentes (a que postular ahora)"
    url: "https://prod4.seace.gob.pe:8086/api/oportunidades/codObjeto/codDepartamento/sintesisProceso/codTipoProceso/0/0/0/0"
    cache_minutos: 60
    activo: true
  ocds_oece:
    descripcion: "Portal Contrataciones Abiertas OECE (historico, Fase 1)"
    url_anual: "https://data.open-contracting.org/en/publication/135/download?name={anio}.jsonl.gz"
    activo: false   # se activa en el modo servidor (Docker), no en Streamlit Cloud

salida:
  base_datos: "data/licitaciones.db"